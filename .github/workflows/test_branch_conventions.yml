name: Test for Malformed Commits in PR Branch

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-branch-conventions:
    if: github.repository == 'ArduPilot/APWeb'
    runs-on: ubuntu-latest
    # pull_request context values reach run: blocks through env, never through
    # ${{ }} interpolation, which a branch name could otherwise break out of
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      BASE_CLONE_URL: ${{ github.event.pull_request.base.repo.clone_url }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          # the commit this run reports on, even if the branch has moved since
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: 'false'
          fetch-depth: 0
          # nothing here pushes, so don't leave the token in .git/config
          persist-credentials: false

      - name: Fetch base branch
        run: |
          git remote add upstream "$BASE_CLONE_URL"
          git fetch upstream "$BASE_REF"

      - name: Install markdownlint-cli2
        run: |
          npm install -g markdownlint-cli2@0.4.0

      - name: Check branch conventions
        env:
          # for the GitHub API calls checking submodule references; only
          # this step needs it
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/check_branch_conventions.py --base-branch "upstream/$BASE_REF"
